id: enquiry_to_booking
version: "1"
status: published
trigger_events:
  - enquiry.created
goals:
  - Establish what the customer needs
  - Offer a valid booking within configured business rules
  - Obtain exact approval where policy requires it
  - Confirm payment and calendar state through authoritative providers
terminal_states:
  - completed
  - cancelled
allowed_actions:
  - send_message
  - find_available_slots
  - propose_booking
  - request_payment
  - create_calendar_event
action_permissions:
  send_message: require_approval
  find_available_slots: allow
  propose_booking: require_approval
  request_payment: require_approval
  create_calendar_event: allow
action_guidance:
  send_message: >
    The parameters JSON must use the exact keys recipient and body. recipient must be a nonblank
    email address and body must be a nonblank, customer-ready plain-text message. Never use an
    empty string, whitespace, or a placeholder for either field.
  find_available_slots: >
    Use a positive integer days parameter describing the search horizon.
  propose_booking: >
    Use nonblank customer_id and slot parameters. The slot must come from an authoritative
    availability result in the current process state. In this fictional adapter, an approved
    proposal is immediately confirmed; do not wait for a separate booking.confirmed event.
  request_payment: >
    Use the confirmed booking_reference and the configured fictional demo amount of 12500 minor
    units in NZD.
  create_calendar_event: >
    Use a nonblank booking_reference, the confirmed booking's starts_at value, and a nonblank
    customer-facing title. Only propose this after completed payment is authoritative.
decision_guidance:
  - >
    When a customer claim states a date and time that exactly matches an authoritative
    booking.available_slots value, treat it as the customer's slot selection. Do not ask the
    customer to select a slot again.
  - >
    In this fictional process, customer.email is the customer_id for propose_booking. A stated
    60-minute appointment is sufficient service detail for the fictional booking adapter.
  - >
    Once an exact selected slot is available, propose_booking for that exact authoritative slot;
    its configured human approval remains required before execution.
  - >
    An operator request_revision instruction is binding for the next proposal. When it identifies
    a permitted next action, do not return a no-op waiting decision instead.
  - >
    Human approval is represented by proposing an action with its configured approval policy; do
    not emit a standalone human approval wake condition.
  - >
    Every waiting decision must include at least one allowed wake condition. After offering
    availability, wait for customer.email_received; after requesting payment, wait for
    payment.completed or payment.failed.
  - >
    Once an approved booking proposal returns booking.status confirmed, request the configured
    fictional payment immediately; do not wait for another customer email.
  - >
    Whenever you propose one or more actions, return status active, never completed. Return
    status completed only on a later turn with no actions and no wake conditions, after
    authoritative action results show that every required action, including create_calendar_event,
    has succeeded and no open commitments remain. An action proposed in the current turn has not
    executed yet.
allowed_wake_events:
  - customer.email_received
  - payment.completed
  - payment.failed
limits:
  max_actions_per_turn: 3
  max_follow_ups_without_reply: 3
  minimum_follow_up_interval_hours: 24
  maximum_timer_horizon_days: 30
review:
  commands:
    - approve
    - reject
    - request_revision
    - comment
communications:
  outbound_action_types:
    - send_message
  reply_event_types:
    - customer.email_received
integrations:
  messaging: stub.messaging.v1
  booking: stub.booking.v1
  payments: stub.payment.v1
  calendar: stub.calendar.v1
