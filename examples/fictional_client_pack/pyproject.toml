[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiramisu-fictional-client-pack"
version = "0.1.0"
description = "Editable downstream client-pack example for Tiramisu"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = ["tiramisu-workspace>=0.1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tiramisu_fictional_client_pack"]
