# Dedicated local test database; independent of the development Compose stack.
name: tiramisu-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tiramisu_test
      POSTGRES_USER: tiramisu
      POSTGRES_PASSWORD: tiramisu
    ports:
      - "127.0.0.1:${TIRAMISU_TEST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiramisu -d tiramisu_test"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  test-postgres-data:
